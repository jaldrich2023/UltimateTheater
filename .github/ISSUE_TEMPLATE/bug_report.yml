name: Bug report
description: Something in Ultimate Theater doesn't work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please check [Known issues](https://github.com/jaldrich2023/UltimateTheater/blob/main/docs/KNOWN_ISSUES.md) first.

        **This issue is public.** Don't include API keys, PINs, pairing codes, email addresses, IP addresses, or personal file paths. Report security problems privately, as described in [SECURITY.md](https://github.com/jaldrich2023/UltimateTheater/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a title…
        2. Click Play…
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playback (Theater engine)
        - Subtitles / Find Subtitles
        - Adding media / watched folders / NAS
        - Movie and TV info (matching, artwork, ratings)
        - Browsing (Home, grids, collections, search)
        - Profiles / PINs / parental controls
        - Skip Intro / Skip Credits / Up Next
        - AirPlay
        - Casting (Google Cast / DLNA / Roku)
        - iPhone remote
        - Watch Stats
        - File repair
        - Settings / setup guide
        - Other
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Ultimate Theater version
      description: Ultimate Theater › About Ultimate Theater
      placeholder: Version 1.0 (1)
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 27.1, MacBook Pro (Apple silicon)
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: File details (for playback, subtitle, or casting problems)
      description: The container and the video, audio, and subtitle codecs (the title page's About section lists the format and tracks). Where the file is stored (Mac, external drive, network share). Please don't attach copyrighted media.
      placeholder: |
        Container: MKV
        Video: HEVC 10-bit, Dolby Vision
        Audio: Dolby TrueHD 7.1, AC-3 5.1
        Subtitles: PGS (English)
        Location: NAS (SMB)
  - type: textarea
    id: device
    attributes:
      label: Casting or remote device (if relevant)
      placeholder: "Chromecast with Google TV; the Cast menu said: …"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Screenshots, a screen recording, or the exact text of an error message.
